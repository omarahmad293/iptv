name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Fetch pinned libmpv
        shell: pwsh
        run: ./download-libmpv.ps1
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/iptv-player.exe dist/
          Copy-Item libs/mpv/libmpv-2.dll dist/
          Compress-Archive -Path dist/* -DestinationPath "iptv-player-${{ github.ref_name }}-windows-x64.zip"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: iptv-player-*-windows-x64.zip
